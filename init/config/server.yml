address: 0.0.0.0
port: 8081
token: your-auth-token
storage: /var/lib/certsync
cert_check_time: "03:00:00"
dns: dns-server
admin:
  username: your-admin-username
  password: bcrypt(your-admin-password)
certs:
- alias: example.com
  auth: your-cert-auth
  email: your-cert-email
  domain: example.com
  domain_cn: []
  domain_check: https://example.com
  provider: TENCENT
  ak: your-access-key
  sk: your-access-key-secret
  auto_renew: true
  upload_token: your-upload-token
